version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: threads-db
    environment:
      POSTGRES_USER: threads
      POSTGRES_PASSWORD: threads123
      POSTGRES_DB: threads
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threads"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
